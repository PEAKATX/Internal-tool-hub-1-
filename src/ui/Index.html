<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    body { font-family: Arial, sans-serif; max-width: 960px; margin: 40px auto; padding: 0 16px; }

<body>
  <h1>AfroTechXcel Staff Dashboard</h1>

      // '<' is escaped so a name can never close the script tag.
      window.ATX_USER = <?!= JSON.stringify(user).replace(/</g, '\\u003c') ?>;
    </script>

    <?!= include('ui/Attendance') ?>

    <?!= include('ui/Tasks') ?>

    <?!= include('ui/Reports') ?>

    <?!= include('ui/StaffDirectory') ?>

      Contact an admin if this is a mistake.</p>
  <? } ?>

</body>
</html>
